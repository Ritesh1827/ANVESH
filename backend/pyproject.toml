[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat"
version = "0.1.0"
description = "Enterprise Cryptographic Discovery & Analysis Tool — Post-quantum cryptography readiness: discovery, risk, and migration intelligence"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # ── Schema validation & data modelling ──────────────────────────────────
    # Core data contract layer; used by every pipeline stage.
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",

    # ── Source parsing (Day 2–3) ─────────────────────────────────────────────
    # Multi-language AST analysis; avoids regex false-positives (PRD §8).
    "tree-sitter>=0.23,<1",
    # Language grammars installed separately as needed (tree-sitter-python, etc.)

    # ── Binary analysis (Day 6) ──────────────────────────────────────────────
    # ELF/PE symbol and import extraction (PRD §8).
    "pyelftools>=0.31,<1",
    # LIEF installed separately (binary wheel); listed here for documentation.
    # "lief>=0.14"  # install via: pip install lief

    # ── Certificate parsing (Day 6) ──────────────────────────────────────────
    # Direct X.509 parsing — issuer, subject, key algorithm, size, expiry (PRD §8).
    "cryptography>=42,<44",

    # ── Secret detection (Day 7) ─────────────────────────────────────────────
    # Catches key-like strings before they leave the local process (PRD §8).
    "detect-secrets>=1.5,<2",

    # ── Reachability graph (Day 5) ───────────────────────────────────────────
    # Call-graph construction and traversal (PRD §8, §11).
    "networkx>=3.3,<4",

    # ── CBOM export (Day 8) ──────────────────────────────────────────────────
    # Schema-correct CycloneDX output rather than hand-built JSON (PRD §8).
    "cyclonedx-python-lib>=7,<8",

    # ── Caching (Day 7) ──────────────────────────────────────────────────────
    # Hash-keyed LLM result cache (PRD §8).
    "redis>=5.0,<6",

    # ── Backend API (Day 9) ──────────────────────────────────────────────────
    # FastAPI + ASGI server (PRD §8).
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.18,<1",

    # ── Database (Day 9) ─────────────────────────────────────────────────────
    # PostgreSQL async driver + SQLAlchemy ORM (PRD §8).
    # SQLite via aiosqlite is the zero-ops default for scan-job persistence.
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "aiosqlite>=0.19,<1",
    "alembic>=1.13,<2",
    "passlib>=1.7.4,<2",
    "bcrypt==4.0.1",

    # ── Report rendering (Day 8) ─────────────────────────────────────────────
    # Jinja2 for roadmap narrative; WeasyPrint for PDF (PRD §8).
    "jinja2>=3.1,<4",
    "weasyprint>=62,<64",

    # ── JSON schema validation (Day 7) ───────────────────────────────────────
    # Hard enforcement on LLM output before it enters the inventory (PRD §6).
    "jsonschema>=4.22,<5",

    # ── HTTP client for LLM API calls (Day 7) ────────────────────────────────
    "httpx>=0.27,<1",
    "google-genai>=1.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    # ── Testing ──────────────────────────────────────────────────────────────
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",

    # ── Code quality ─────────────────────────────────────────────────────────
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecdat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
