services:
  - type: web
    name: anvesh-backend
    env: python
    buildCommand: pip install -e backend
    startCommand: uvicorn ecdat.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ECDAT_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
